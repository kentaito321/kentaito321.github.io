# News items, newest first.
#
# To add one, copy a block and edit it. `date` drives both the label shown on
# the page and the sort order, so keep it a real YYYY-MM-DD date. `text` may
# contain HTML (links, <em>, emoji) and is rendered as-is.
#
# The homepage shows the 5 most recent; /news/ shows all of them.

